services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketguard
      POSTGRES_PASSWORD: ticketguard
      POSTGRES_DB: ticketguard
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketguard -d ticketguard']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      DATABASE_URL: postgresql://ticketguard:ticketguard@postgres:5432/ticketguard?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:5000
      APP_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '5000:5000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:5000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
        VITE_SOCKET_URL: http://localhost:5000
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
